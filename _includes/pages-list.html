{% assign page_files = site.static_files | where_exp: "f", "f.path contains '/pages/'" %}
{% if page_files.size > 0 %}
<section id="pages" class="pages-section">
  <div class="pages-inner">
    <h1>Pages</h1>
    <ul class="pages-grid">
      {% for f in page_files %}
        {% if f.extname == ".html" or f.extname == ".htm" %}
          <li class="page-card">
            <a href="{{ f.path | relative_url }}">
              <span class="page-name">{{ f.basename }}</span>
            </a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</section>
{% endif %}
